name: CI
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
jobs:
  linting:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        tox-env: [black, flake8]
    steps:
    - uses: actions/checkout@v7
    - name: Using Python 3.11
      uses: actions/setup-python@v7
      with:
        python-version: "3.11"
    - name: Install tox
      run: python -m pip install tox
    - name: Run tox env ${{ matrix.tox-env }}
      run: tox -e ${{ matrix.tox-env }}
  test:
    name: test (${{ matrix.os }}, python ${{ matrix.python-version }}, viash ${{ matrix.viash-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python-version: ["3.11", "3.12", "3.13", "3.14", "3.15"]
        viash-version: ["0.8.8", "0.9.7", "0.10.0-RC1"]
        exclude:
          # Running a component from Viash Hub (viash >= 0.10.0) needs docker,
          # which the macOS runners do not have.
          - os: macos-latest
            viash-version: "0.10.0-RC1"

    steps:
      - uses: actions/checkout@v7
      # viash follows the version in _viash.yaml, so keep it in sync.
      - name: Set viash version
        run: |
          printf 'viash_version: %s\n' "${{ matrix.viash-version }}" > _viash.yaml
      - uses: viash-io/viash-actions/setup@v6
        with:
          version: ${{ matrix.viash-version }}
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install tox
        run: python -m pip install tox
      - name: Test
        run: |
          PYTHON_ENV="${{ matrix.python-version }}"
          PYTHON_ENV_NO_DOTS=${PYTHON_ENV//.}
          tox run --skip-env '^(?!py'$PYTHON_ENV_NO_DOTS').+'
  integration_tests:
    name: integration_tests (viash ${{ matrix.viash-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - viash-version: "0.8.8"
            src: tests/integration/viash_0.8
            engine-arg: -p docker
          - viash-version: "0.9.7"
            src: tests/integration/viash_0.9
            engine-arg: --engine docker
          - viash-version: "0.10.0-RC1"
            src: tests/integration/viash_0.9
            engine-arg: --engine docker
    steps:
    - uses: actions/checkout@v7
    # The test container installs the viash version from _viash.yaml,
    # so keep it in sync with the viash version on the runner.
    - name: Set viash version
      run: |
        printf 'viash_version: %s\n' "${{ matrix.viash-version }}" > _viash.yaml
    - uses: viash-io/viash-actions/setup@v6
      with:
        version: ${{ matrix.viash-version }}
    # `viash ns test` exits 0 even when a build or test fails,
    # so check the result column of the summary TSV instead.
    # See https://github.com/viash-io/viash/issues/942
    - name: Viash ns test
      run: |
        viash ns test -s ${{ matrix.src }} ${{ matrix.engine-arg }} --memory 1GB --tsv ns_test_results.tsv
        echo "Test summary:"
        column -t -s $'\t' ns_test_results.tsv || cat ns_test_results.tsv
        if [ "$(tail -n +2 ns_test_results.tsv | wc -l)" -eq 0 ]; then
          echo "::error::No tests were run."
          exit 1
        fi
        if tail -n +2 ns_test_results.tsv | awk -F'\t' '$NF != "SUCCESS" { bad = 1 } END { exit !bad }'; then
          echo "::error::Not all configs built and tested successfully."
          exit 1
        fi
