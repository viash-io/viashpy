# For more information about tox, see https://tox.readthedocs.io/en/latest/
[tox]
envlist = 
    py310-pytest6
    py{310,311,312}-pytest7
    py{310,311,312,313,314,315}-pytest{8,9}
    flake8
isolated_build = True

[testenv]
deps = 
    pytest6: pytest>=6.2,<7
    pytest7: pytest>=7,<8
    pytest8: pytest>=8,<9
    pytest9: pytest>=9,<10
    coverage
    pytest-mock
commands = 
    coverage run -m pytest --pyargs tests/unittests
    coverage report -m
    coverage xml

[testenv:flake8]
skip_install = true
deps = flake8
commands = flake8 viashpy tests --exclude viashpy/__version__.py

[coverage:run]
branch = True
source_pkgs = viashpy
omit =
    viashpy/__version__.py

[testenv:black]
basepython = python3
deps = black
skip_install = true
commands = black --check .